; Sound Blaster G8 - ALSA card profile set.
;
; Identical to the stock default.conf, except that the analog-stereo mapping
; also probes analog-input-external-mic: the path that gives the card a
; microphone port (see paths/analog-input-external-mic.conf for why the stock
; ones don't).
;
; Bound to the card by 91-soundblaster-g8-acp.rules, through the
; ENV{ACP_PROFILE_SET} udev property that default.conf's header documents.

.include default.conf

; Redefining a section adds to the mapping default.conf already declared. The
; unchanged fields are repeated verbatim from default.conf rather than left
; out, so this file does not depend on how the parser merges a redefinition.
; Only paths-input differs: analog-input-external-mic, first.
[Mapping analog-stereo]
device-strings = front:%f
channel-map = left,right
paths-output = analog-output analog-output-lineout analog-output-speaker analog-output-headphones analog-output-headphones-2
paths-input = analog-input-external-mic analog-input-front-mic analog-input-rear-mic analog-input-internal-mic analog-input-dock-mic analog-input analog-input-mic analog-input-linein analog-input-aux analog-input-video analog-input-tvtuner analog-input-fm analog-input-mic-line analog-input-headphone-mic analog-input-headset-mic
priority = 15
