; Sound Blaster G8 - microphone input path for PipeWire/PulseAudio's ALSA card
; profile (ACP).
;
; Why this file exists: the stock paths/analog-input-mic.conf only maps the
; "Mic" and "Mic-In/Mic Array" items of the "PCM Capture Source" enumeration.
; The G8 names its item "External Mic", which matches nothing, so ACP builds no
; microphone port for the card. paths/analog-input-linein.conf *does* map
; "Line In", so the line input ends up the card's only analog input port - ACP
; selects it and writes "PCM Capture Source" back to "Line In" every time it
; applies the route (card creation, source resume, wireplumber restart). That
; is what silently undid soundblaster-g8-alsa-fix.sh's amixer write.
;
; Selected per-card by 91-soundblaster-g8-acp.rules + profile-sets/soundblaster-g8.conf.
;
; See analog-output.conf.common (shipped with pipewire) for the directives.

[General]
; Above analog-input-mic (87) and analog-input-linein (81), so the microphone
; is the default input port on a fresh WirePlumber state. Line In stays
; selectable.
priority = 88
description-key = analog-input-microphone

[Element PCM Capture Source]
enumeration = select

; required-any: no "External Mic" item, no path. Nothing to match on any card
; other than this one.
[Option PCM Capture Source:External Mic]
name = analog-input-microphone
required-any = any

; Carries the capture volume/switch for this port (cvolume + cswitch on the G8).
[Element External Mic]
required-any = any
switch = mute
volume = merge
override-map.1 = all
override-map.2 = all-left,all-right

; The card's other capture elements: not part of this port, and must not be
; merged into its volume.
[Element Line In]
switch = off
volume = off

[Element S/PDIF In]
switch = off
volume = off

[Element What U Hear]
switch = off
volume = off

[Element Speaker]
switch = off
volume = off

.include analog-input-mic.conf.common
