[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "soundblaster-g8"
version = "0.1.0"
description = "Application de contrôle pour Creative Sound Blaster G8"
requires-python = ">=3.12"
authors = [{name = "OpenCreativeApp"}]
dependencies = ["hidapi>=0.10.0"]

[project.optional-dependencies]
hid = ["hidapi>=0.10.0"]
# cairosvg is only needed to regenerate gui/icon_data.py from the bundled
# Bootstrap SVGs (tools/build_icons.py); the generated module is committed, so
# running the application never requires it.
build = ["pyinstaller>=6.0", "cairosvg>=2.7"]

[project.scripts]
soundblaster-g8 = "soundblaster_g8.__main__:main"

[tool.setuptools.packages.find]
include = ["soundblaster_g8*"]

[tool.setuptools.package-data]
soundblaster_g8 = ["gui/assets/*.png", "locale/*/LC_MESSAGES/*.mo"]